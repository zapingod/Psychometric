<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>פרקי חשיבה כמותית</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans Hebrew', sans-serif;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- Header Section -->
    <header class="bg-blue-600 text-white py-8 text-center">
        <h1 class="text-4xl font-bold">פרקי חשיבה כמותית</h1>
        <p class="text-xl mt-4">שפר את יכולותיך בפתרון בעיות כמותיות.</p>
    </header>

    <!-- Video Section -->
    <section class="container mx-auto p-6 mt-8">
        <h2 class="text-3xl font-semibold mb-6">צפה בסרטון הבא</h2>
        <video id="lesson-video" controls class="w-full rounded mb-4 bg-black">
            <source src="lesson1-video.mp4" type="video/mp4">
            הדפדפן שלך אינו תומך בניגון וידאו.
        </video>
    </section>

    <!-- Questions Section -->
    <section id="quiz-section" class="container mx-auto p-6 mt-8">
        <h2 class="text-3xl font-semibold mb-6">השאלות:</h2>
        <div id="quiz-container" class="space-y-6">
            <!-- Questions will be added here dynamically -->
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="bg-white text-center p-4 mt-12 shadow">
        <a href="../index.html" class="text-blue-600">חזור לדף הבית</a>
    </footer>

    <!-- Cookie Consent Script -->
    <script src="../src/cookie-consent.js" charset="utf-8"></script>

    <!-- Main JavaScript -->
    <script>
        // Define quiz questions
        const questions = [
            {
                question: "מהו תוצאה של חיבור 25 ו-37?",
                options: ["62", "50", "60", "75"],
                correctAnswer: 0 // the index of the correct option
            },
            {
                question: "מהו מכפלת 9 ב-8?",
                options: ["72", "80", "90", "75"],
                correctAnswer: 0 // the index of the correct option
            }
        ];

        // Load questions into the page
        document.addEventListener("DOMContentLoaded", function () {
            const quizContainer = document.getElementById("quiz-container");

            questions.forEach((q, index) => {
                const questionElement = document.createElement("div");
                questionElement.classList.add("question");
                questionElement.innerHTML = `
                    <p class="question-text">${q.question}</p>
                    <div class="options">
                        ${q.options.map((option, i) => `
                            <button class="option bg-blue-500 text-white px-4 py-2 rounded mb-2" onclick="answerQuestion(${index}, ${i})">${option}</button>
                        `).join('')}
                    </div>
                    <span class="result hidden text-green-600 font-bold"></span>
                `;
                quizContainer.appendChild(questionElement);
            });
        });

        // Function to handle the answer and show results
        function answerQuestion(questionIndex, selectedOptionIndex) {
            const question = questions[questionIndex];
            const questionElement = document.querySelectorAll('.question')[questionIndex];
            const resultElement = questionElement.querySelector('.result');
            const options = questionElement.querySelectorAll('.option');

            // Show result
            if (selectedOptionIndex === question.correctAnswer) {
                resultElement.textContent = "✅ תשובה נכונה!";
                resultElement.classList.remove("hidden");
                questionElement.classList.add("answered");
            } else {
                resultElement.textContent = "❌ תשובה שגויה!";
                resultElement.classList.remove("hidden");
            }

            // Disable all options after answering
            options.forEach(option => {
                option.disabled = true;
            });
        }
    </script>
</body>
</html>
