<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פרקי חשיבה מילולית</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Noto Sans Hebrew', sans-serif; }
    .hidden { display: none; }
    .answered { opacity: 0.5; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-blue-600 text-white py-8 text-center">
    <h1 class="text-4xl font-bold">פרקי חשיבה מילולית</h1>
    <p class="text-xl mt-4">העמק את כישורי החשיבה המילולית שלך.</p>
  </header>

  <!-- Tabs -->
  <section class="container mx-auto mt-10 px-4">
    <div class="flex justify-center gap-4 mb-6">
      <button onclick="showLesson('lesson1')" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">שיעור 1</button>
      <button onclick="showLesson('lesson2')" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">שיעור 2</button>
    </div>

    <!-- Lesson 1 -->
    <div id="lesson1" class="lesson hidden">
      <h2 class="text-2xl font-semibold mb-4">שיעור 1: הבנת הנקרא</h2>
      <video controls class="w-full rounded mb-4 bg-black">
        <source src="lesson1-video.mp4" type="video/mp4">
      </video>
      <div id="quiz-container-1" class="space-y-4"></div>
    </div>

    <!-- Lesson 2 -->
    <div id="lesson2" class="lesson hidden">
      <h2 class="text-2xl font-semibold mb-4">שיעור 2: אנלוגיות מילוליות</h2>
      <video controls class="w-full rounded mb-4 bg-black">
        <source src="lesson2-video.mp4" type="video/mp4">
      </video>
      <div id="quiz-container-2" class="space-y-4"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-white text-center p-4 mt-12 shadow">
    <a href="../index.html" class="text-blue-600">חזור לדף הבית</a>
  </footer>

  <!-- 1) Load questionsVer.js to define `questions` globally -->
  <script src="questionsVer.js"></script>

  <!-- 2) Quiz rendering logic -->
  <script>
    function showLesson(id) {
      document.querySelectorAll('.lesson').forEach(el => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function answerQuestion(containerId, qIndex, optIndex) {
      const q = questions[qIndex];
      const container = document.getElementById(containerId);
      const questionDiv = container.querySelectorAll('.question')[qIndex];
      const resultSpan = questionDiv.querySelector('.result');
      const buttons = questionDiv.querySelectorAll('button');

      if (optIndex === q.correctAnswer) {
        resultSpan.textContent = "✅ תשובה נכונה!";
      } else {
        resultSpan.textContent = "❌ תשובה שגויה!";
      }
      resultSpan.classList.remove('hidden');
      buttons.forEach(b => b.disabled = true);
      questionDiv.classList.add('answered');
    }

    function loadQuestions(containerId) {
      const container = document.getElementById(containerId);
      questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'question bg-white p-4 rounded shadow';
        div.innerHTML = `
          <p class="mb-2 font-medium">${q.question}</p>
          ${q.options.map((opt, j) => `
            <button
              class="option bg-blue-500 text-white px-4 py-2 rounded mb-2"
              onclick="answerQuestion('${containerId}', ${i}, ${j})">
              ${opt}
            </button>
          `).join('')}
          <p class="result hidden font-bold mt-2"></p>
        `;
        container.appendChild(div);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadQuestions('quiz-container-1');
      loadQuestions('quiz-container-2');
      // Optionally, show the first lesson by default:
      showLesson('lesson1');
    });
  </script>

  <!-- Cookie Consent -->
  <script src="../src/cookie-consent.js" charset="utf-8"></script>
</body>
</html>
