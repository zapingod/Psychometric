<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ברוך הבא לאתר שלי</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font for Hebrew -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans Hebrew', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Hero Section -->
  <section class="bg-blue-600 text-white py-20 text-center px-4">

      התחל ללמוד
    </button>
  </section>

  <!-- Menu Section -->
  <section class="container mx-auto p-6 mt-12 text-center">
    <h2 class="text-3xl font-semibold mb-8">בחר מה ללמוד</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- HTML Box -->
      <a href="#" class="bg-white p-6 shadow-lg rounded-lg hover:bg-blue-500 hover:text-white transition duration-300 flex flex-col items-center justify-center text-center cursor-pointer">
        <h3 class="text-2xl font-semibold mb-4">ללמוד HTML</h3>
        <p class="text-lg">הבנת את אבני הבניין של דפי האינטרנט.</p>
      </a>

      <!-- CSS Box -->
      <a href="#" class="bg-white p-6 shadow-lg rounded-lg hover:bg-blue-500 hover:text-white transition duration-300 flex flex-col items-center justify-center text-center cursor-pointer">
        <h3 class="text-2xl font-semibold mb-4">ללמוד CSS</h3>
        <p class="text-lg">עצב את האתר שלך בצורה מדהימה.</p>
      </a>

      <!-- JS Box -->
      <a href="#" class="bg-white p-6 shadow-lg rounded-lg hover:bg-blue-500 hover:text-white transition duration-300 flex flex-col items-center justify-center text-center cursor-pointer">
        <h3 class="text-2xl font-semibold mb-4">ללמוד JavaScript</h3>
        <p class="text-lg">הפוך את האתר שלך לאינטראקטיבי עם JS.</p>
      </a>

    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-white text-center p-4 mt-12 shadow">
    <p>&copy; 2025 My Cool Website</p>
  </footer>

</body>
</html>
